services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idam
      POSTGRES_PASSWORD: idam
      POSTGRES_DB: idam
    ports: ["5432:5432"]
    volumes: [idam-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idam"]
      interval: 5s
      retries: 10
volumes:
  idam-db:
