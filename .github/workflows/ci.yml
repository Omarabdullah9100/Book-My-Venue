name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: idam, POSTGRES_PASSWORD: idam, POSTGRES_DB: idam }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idam" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://idam:idam@localhost:5432/idam?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run ci
      - run: npm run build
